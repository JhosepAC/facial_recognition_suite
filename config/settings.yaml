# =========================================================
# Global configuration — Facial Recognition Suite
# =========================================================

app:
  name: "FaceScan"
  # Version is managed in app/__init__.py (__version__); the YAML value
  # is intentionally ignored to keep a single source of truth.
  version: "1.0.0"
  theme: "dark"              # dark | light
  language: "es"

database:
  path: "data/biovision.db"
  echo_sql: false

vision:
  detector_backend: "insightface"     # insightface | mediapipe
  detector_model: "buffalo_l"         # InsightFace model pack (RetinaFace/SCRFD + ArcFace)
  det_size: [640, 640]
  ctx_id: -1                          # -1 = CPU, 0 = first available CUDA GPU
  min_face_confidence: 0.30           # Detector confidence threshold (lower = more detections)
  embedding_dim: 512
  quality_min_score: 25.0             # Minimum quality score (0-100) to accept a face (enrollment and match) — lowered from 45 to improve recall on real photos/videos
  retry_downscale: 0.5                # Retry scale when no face is detected
  min_face_size: 32                   # Minimum side (px) of the bounding box to consider a face usable — allows smaller faces in video
  max_yaw_deg: 35.0                   # Maximum yaw angle tolerated during enrollment (degrees) — relaxed to improve recall
  max_pitch_deg: 40.0                 # Maximum pitch angle tolerated during enrollment (degrees) — heuristic frontal pitch ~30-38°, raised to 40 to avoid rejecting valid photos like facescan/jhosep-*.jpeg
  enroll_require_single_face: true    # Reject group photos during enrollment (single face required)
  enable_face_attributes: true        # Extended facial analysis (glasses/mask/beard/moustache/smile/eyes)

recognition:
  similarity_metric: "cosine"
  match_threshold: 0.55      # Maximum cosine distance to consider a match — raised from 0.40 (too strict, caused false negatives) to 0.55, recommended value for buffalo_l in real conditions
  top_k_results: 5
  apply_quality_gate: false   # Disabled to improve recall: the gate silently discarded valid faces in photo/video/webcam. Keep true only if quality is critical.
  dedupe_threshold: 0.30     # Distance below which faces are considered the same when deduplicating
  # --- ANN index (FAISS) for 1:N search ---
  ann_enabled: true          # Enable approximate index (requires faiss-cpu installed)
  ann_min_size: 256          # Gallery smaller than this -> exact linear search
  ann_ivf_min_size: 2000     # Above this size use IndexIVFFlat (real ANN); below -> exact flat
  ann_nlist: 0               # Number of IVF clusters; 0 = auto (min(n//64, 1024))
  ann_nprobe: 0              # Number of clusters to probe; 0 = auto (max(1, nlist//8))
  ann_persist: false         # Persist IVF index to disk (faster startup for large galleries)
  ann_index_dir: "data/ann_index"

camera:
  default_index: 0
  frame_width: 960
  frame_height: 540
  target_fps: 30
  recognition_interval_frames: 10   # Run recognition every N frames (performance) — raised from 5 to 10 to reduce CPU load and keep UI fluid
  max_recognition_width: 640        # Maximum width for live inference (downscale before detection, bounding box is rescaled)
  display_max_fps: 30               # Maximum UI rendering FPS (throttle)

video:
  allowed_extensions: [".mp4", ".avi", ".mov", ".mkv"]
  sample_interval_frames: 15        # Process 1 of every N frames (at 30fps ~ every 0.5s)
  max_processing_width: 960         # Resize large frames before detection (performance)
  evidence_crop_padding: 0.25       # Proportional margin around the face when saving evidence
  save_evidence_thumbnails: true
  evidence_dir: "data/video_evidence"

storage:
  photos_dir: "data/photos"
  thumbnails_dir: "data/thumbnails"
  exports_dir: "exports"
  logs_dir: "logs"

security:
  session_timeout_minutes: 30
  max_session_minutes: 0           # 0 = no total session duration cap
  remember_credentials_days: 30    # Days until Remember Session requires login again
  min_password_length: 8
  lockout_attempts: 5
  lockout_minutes: 15
  # Delay (ms) between failed login attempts and account registrations.
  # 0 disables throttling (not recommended).
  login_failure_delay_ms: 250
  # Self-registration of new accounts from the login screen.
  allow_self_registration: true
  default_registration_role: "Operador"

logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "30 days"
